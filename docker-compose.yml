version: '3.8'

services:
  # ─── API Gateway (seul service exposé) ─────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: brvm-gateway
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      PORT: "5000"
    depends_on:
      - user-service
      - company-service
      - market-data-service
      - portfolio-service
      - education-service
      - subscription-service
      - credit-service
      - ai-service
      - report-service
    networks:
      - brvm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── User Service ───────────────────────────────────────
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: brvm-user-svc
    env_file: .env
    environment:
      PORT: "3001"
      DB_NAME: "${USER_DB_NAME}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── Company Service ────────────────────────────────────
  company-service:
    build:
      context: ./services/company-service
      dockerfile: Dockerfile
    container_name: brvm-company-svc
    env_file: .env
    environment:
      PORT: "3002"
      DB_NAME: "${COMPANY_DB_NAME}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── Market Data Service ────────────────────────────────
  market-data-service:
    build:
      context: ./services/market-data-service
      dockerfile: Dockerfile
    container_name: brvm-market-svc
    env_file: .env
    environment:
      PORT: "3003"
      DB_NAME: "${COMPANY_DB_NAME}"
      COMPANY_SERVICE_URL: "http://company-service:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── Portfolio Service ──────────────────────────────────
  portfolio-service:
    build:
      context: ./services/portfolio-service
      dockerfile: Dockerfile
    container_name: brvm-portfolio-svc
    env_file: .env
    environment:
      PORT: "3004"
      DB_NAME: "${PORTFOLIO_DB_NAME}"
      COMPANY_SERVICE_URL: "http://company-service:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── Education Service ──────────────────────────────────
  education-service:
    build:
      context: ./services/education-service
      dockerfile: Dockerfile
    container_name: brvm-education-svc
    env_file: .env
    environment:
      PORT: "3005"
      DB_NAME: "${EDUCATION_DB_NAME}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── Subscription Service ───────────────────────────────
  subscription-service:
    build:
      context: ./services/subscription-service
      dockerfile: Dockerfile
    container_name: brvm-subscription-svc
    env_file: .env
    environment:
      PORT: "3006"
      DB_NAME: "${SUBSCRIPTION_DB_NAME}"
      CREDIT_SERVICE_URL: "http://credit-service:3007"
      USER_SERVICE_URL: "http://user-service:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── Credit Service ─────────────────────────────────────
  credit-service:
    build:
      context: ./services/credit-service
      dockerfile: Dockerfile
    container_name: brvm-credit-svc
    env_file: .env
    environment:
      PORT: "3007"
      DB_NAME: "${CREDIT_DB_NAME}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── AI Service ─────────────────────────────────────────
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: brvm-ai-svc
    env_file: .env
    environment:
      PORT: "3008"
      COMPANY_SERVICE_URL: "http://company-service:3002"
      CREDIT_SERVICE_URL: "http://credit-service:3007"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── Report Service ─────────────────────────────────────
  report-service:
    build:
      context: ./services/report-service
      dockerfile: Dockerfile
    container_name: brvm-report-svc
    env_file: .env
    environment:
      PORT: "3009"
      DB_NAME: "${REPORT_DB_NAME}"
      COMPANY_SERVICE_URL: "http://company-service:3002"
      AI_SERVICE_URL: "http://ai-service:3008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - report-storage:/app/reports
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── phpMyAdmin ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: brvm-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: "172.19.0.1"
      PMA_PORT: "3306"
      PMA_USER: "node"
      PMA_PASSWORD: "brvm_dev_2024"
      UPLOAD_LIMIT: "64M"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brvm-network
    restart: unless-stopped

  # ─── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ../brvm-frontend
      dockerfile: Dockerfile
    container_name: brvm-frontend
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - brvm-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`afrivesting.com`) || Host(`www.afrivesting.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # ─── Analytics (Umami) ─────────────────────────────────────
  umami:
    image: ghcr.io/umami-software/umami:mysql-v2.10.2
    container_name: brvm-umami
    environment:
      DATABASE_URL: mysql://umami:umami_brvm_2024@172.19.0.1:3306/umami
      APP_SECRET: brvm_umami_secret_2024_afrivesting
    networks:
      - brvm-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`analytics.afrivesting.com`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"

volumes:
  report-storage:

networks:
  brvm-network:
    driver: bridge
    name: brvm-network
